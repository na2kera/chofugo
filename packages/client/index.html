<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#100d08" />
    <title>超富豪</title>
    <!-- リンクを共有したときのプレビュー。招待リンク（/r/…）でも同じ HTML が返るので、og:url は書かない。
         画像は絶対 URL が要る。表示先がキャッシュするので、絵を差し替えるときはファイル名を変える。 -->
    <meta name="description" content="ブラウザで遊ぶ、4人対戦の大富豪。リンクを開けばそのまま参加できます。" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="超富豪" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:title" content="超富豪" />
    <meta property="og:description" content="ブラウザで遊ぶ、4人対戦の大富豪。リンクを開けばそのまま参加できます。" />
    <meta property="og:image" content="https://chofugo.na2kera.workers.dev/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="超富豪" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preload" href="/fonts/DotGothic16-Regular.ttf" as="font" type="font/ttf" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
