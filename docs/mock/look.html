<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>超富豪 画面の見た目の案</title>
<style>
  :root {
    --bg: #0b0a08;
    --panel: #16130e;
    --panel-2: #1f1b14;
    --line: #3a3120;
    --gold: #c9a24b;
    --gold-hi: #ecd698;
    --gold-lo: #8a6a26;
    --text: #efe8d6;
    --muted: #9b917a;
    --card: #faf6ea;
    --card-edge: #d9d0b8;
    --red: #b4261f;
    --ink: #1a1a1a;
    --danger: #d9614f;
    --serif: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    --sans: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #050504; color: var(--text); font-family: var(--sans); }
  header.page { padding: 28px 24px 8px; max-width: 1320px; margin: 0 auto; }
  header.page h1 { font-family: var(--serif); font-weight: 600; font-size: 22px; margin: 0 0 6px; color: var(--gold-hi); letter-spacing: .08em; }
  header.page p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.7; }
  .boards { display: flex; flex-wrap: wrap; gap: 28px; padding: 24px; max-width: 1320px; margin: 0 auto; justify-content: center; }
  figure { margin: 0; }
  figcaption { font-size: 13px; color: var(--muted); margin: 0 0 10px 4px; letter-spacing: .06em; }
  figcaption b { color: var(--gold); font-weight: 600; margin-right: 8px; }

  .phone {
    width: 390px; height: 800px; border-radius: 34px; overflow: hidden; position: relative;
    background:
      radial-gradient(120% 70% at 50% 42%, #221c12 0%, #14110c 45%, var(--bg) 100%);
    border: 1px solid #2c261a; box-shadow: 0 0 0 6px #0e0d0b, 0 24px 60px rgba(0,0,0,.6);
    display: flex; flex-direction: column;
  }
  .gold-text { background: linear-gradient(180deg, var(--gold-hi), var(--gold) 55%, var(--gold-lo)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .rule { height: 1px; background: linear-gradient(90deg, transparent, var(--gold-lo), transparent); border: 0; margin: 0; }

  /* ---------- 共通の部品 ---------- */
  .btn { font-family: var(--sans); font-size: 16px; font-weight: 600; border-radius: 12px; height: 52px; padding: 0 22px; border: 1px solid var(--gold-lo); background: transparent; color: var(--gold-hi); letter-spacing: .1em; }
  .btn.primary { background: linear-gradient(180deg, #e9d08c, #c39a40 60%, #a37c2a); color: #1b1408; border-color: #f1dfa6; box-shadow: 0 6px 18px rgba(201,162,75,.25), inset 0 1px 0 rgba(255,255,255,.45); }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; font-size: 12px; border: 1px solid var(--line); background: rgba(0,0,0,.35); color: var(--text); }
  .chip.gold { border-color: var(--gold-lo); color: var(--gold-hi); background: rgba(201,162,75,.12); }
  .chip.warn { border-color: #6d2f27; color: #f0a79b; background: rgba(180,38,31,.16); }
  .badge { font-family: var(--serif); font-size: 11px; padding: 2px 7px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); letter-spacing: .08em; }
  .badge.top { border-color: var(--gold); color: #1b1408; background: linear-gradient(180deg, #ecd698, #c9a24b); font-weight: 700; }

  .card { width: 56px; height: 80px; border-radius: 7px; background: var(--card); border: 1px solid var(--card-edge); box-shadow: 0 2px 5px rgba(0,0,0,.45); position: relative; color: var(--ink); flex: none; }
  .card.r { color: var(--red); }
  .card .n { position: absolute; top: 4px; left: 6px; font-family: var(--serif); font-weight: 700; font-size: 20px; line-height: 1; }
  .card .s { position: absolute; top: 25px; left: 6px; font-size: 15px; line-height: 1; }
  .card .big { position: absolute; right: 6px; bottom: 4px; font-size: 26px; line-height: 1; opacity: .9; }
  .card .n.t { font-size: 17px; letter-spacing: -2px; top: 6px; left: 4px; }
  .card.joker .n { font-size: 11px; letter-spacing: .02em; top: 6px; writing-mode: vertical-rl; }
  .card.joker .big { font-size: 24px; color: var(--gold-lo); }
  .card.dim { filter: brightness(.48) saturate(.6); }
  .card.sel { transform: translateY(-16px); box-shadow: 0 0 0 2px var(--gold-hi), 0 10px 18px rgba(201,162,75,.35); }
  .back { width: 26px; height: 37px; border-radius: 4px; border: 1px solid var(--gold-lo); background: repeating-linear-gradient(45deg, #2a2110 0 3px, #1a1509 3px 6px); box-shadow: 0 1px 3px rgba(0,0,0,.5); flex: none; }

  /* ---------- 対戦画面 ---------- */
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px; font-size: 12px; color: var(--muted); }
  .topbar .title { font-family: var(--serif); font-size: 15px; letter-spacing: .2em; }
  .opps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 6px 12px 0; }
  .opp { border: 1px solid var(--line); border-radius: 12px; padding: 9px 8px 8px; background: rgba(0,0,0,.28); text-align: center; position: relative; }
  .opp.turn { border-color: var(--gold); box-shadow: 0 0 0 1px rgba(201,162,75,.35), 0 0 22px rgba(201,162,75,.18); }
  .opp .name { font-size: 13px; margin: 5px 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .opp .fan { display: flex; justify-content: center; height: 37px; }
  .opp .fan .back { margin-left: -17px; } .opp .fan .back:first-child { margin-left: 0; }
  .opp .count { font-family: var(--serif); font-size: 18px; color: var(--gold-hi); margin-top: 5px; }
  .opp .count small { font-family: var(--sans); font-size: 10px; color: var(--muted); margin-left: 2px; }
  .opp .tag { position: absolute; top: -9px; right: 8px; font-size: 10px; padding: 1px 7px; border-radius: 8px; background: #2a2418; border: 1px solid var(--line); color: var(--muted); }
  .opp.out { opacity: .5; }
  .timer { height: 3px; border-radius: 2px; background: #2a2418; margin-top: 7px; overflow: hidden; }
  .timer i { display: block; height: 100%; width: 62%; background: linear-gradient(90deg, var(--gold-lo), var(--gold-hi)); }

  .field { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; position: relative; }
  .field .ring { position: absolute; width: 300px; height: 190px; border-radius: 50%; border: 1px solid rgba(201,162,75,.22); box-shadow: inset 0 0 50px rgba(201,162,75,.07); }
  .field .cards { display: flex; gap: 6px; z-index: 1; }
  .field .cards .card { width: 66px; height: 94px; }
  .field .cards .card .n { font-size: 24px; } .field .cards .card .s { top: 30px; font-size: 17px; } .field .cards .card .big { font-size: 32px; }
  .field .who { font-size: 12px; color: var(--muted); z-index: 1; }
  .states { display: flex; gap: 6px; z-index: 1; }
  .log { font-size: 12px; color: var(--gold-hi); text-align: center; padding: 7px 12px; margin: 0 16px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: rgba(0,0,0,.25); }

  .me { padding: 10px 14px 0; }
  .me .row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .me .row .sp { flex: 1; }
  .me .sec { font-family: var(--serif); font-size: 18px; color: var(--gold-hi); }
  .hand { display: flex; padding: 22px 12px 8px; justify-content: center; }
  .hand .card { margin-left: -31px; transition: transform .15s; } .hand .card:first-child { margin-left: 0; }
  .actions { display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px; padding: 6px 14px 22px; }

  /* ---------- ロビー ---------- */
  .lobby { padding: 20px 16px 18px; display: flex; flex-direction: column; gap: 9px; height: 100%; }
  .logo { text-align: center; font-family: var(--serif); font-size: 32px; font-weight: 700; letter-spacing: .28em; padding-left: .28em; }
  .sub { text-align: center; font-size: 11px; color: var(--muted); letter-spacing: .3em; margin-top: -8px; }
  .box { border: 1px solid var(--line); border-radius: 14px; background: rgba(0,0,0,.28); padding: 9px 12px; }
  .box h3 { margin: 0 0 6px; font-family: var(--serif); font-size: 13px; font-weight: 600; color: var(--gold); letter-spacing: .14em; }
  .link { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
  .link code { flex: 1; font-family: ui-monospace, monospace; color: var(--text); background: #0d0b08; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .link .btn { height: 34px; font-size: 12px; padding: 0 12px; border-radius: 8px; }
  .seat { display: flex; align-items: center; gap: 10px; padding: 4px 0; font-size: 14px; border-top: 1px solid #241f15; }
  .seat:first-of-type { border-top: 0; }
  .seat .av { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--gold-lo); display: grid; place-items: center; font-family: var(--serif); font-size: 13px; color: var(--gold-hi); background: #1c170e; }
  .seat .sp { flex: 1; } .seat.cpu { color: var(--muted); } .seat.cpu .av { border-color: var(--line); color: var(--muted); }
  .rules { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .tg { display: flex; align-items: center; justify-content: space-between; gap: 6px; border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: 13px; }
  .tg.on { border-color: var(--gold-lo); background: rgba(201,162,75,.08); }
  .sw { width: 34px; height: 20px; border-radius: 10px; background: #2a2418; position: relative; flex: none; }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #6b6250; }
  .tg.on .sw { background: linear-gradient(180deg, #e2c77f, #b48d35); } .tg.on .sw::after { left: 16px; background: #fffaf0; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; font-size: 13px; text-align: center; }
  .seg span { padding: 7px 0; color: var(--muted); } .seg span.on { background: rgba(201,162,75,.16); color: var(--gold-hi); }
  .grow { flex: 1; }

  /* ---------- 結果 ---------- */
  .result { padding: 30px 18px 22px; display: flex; flex-direction: column; gap: 14px; height: 100%; }
  .result h2 { font-family: var(--serif); font-size: 26px; letter-spacing: .3em; padding-left: .3em; text-align: center; margin: 0; }
  .result .small { text-align: center; font-size: 12px; color: var(--muted); margin-top: -6px; }
  .rank { display: grid; grid-template-columns: 34px 1fr auto auto; align-items: center; gap: 10px; padding: 13px 14px; border: 1px solid var(--line); border-radius: 14px; background: rgba(0,0,0,.28); }
  .rank.first { border-color: var(--gold); background: linear-gradient(180deg, rgba(201,162,75,.2), rgba(201,162,75,.05)); box-shadow: 0 0 26px rgba(201,162,75,.16); }
  .rank .no { font-family: var(--serif); font-size: 24px; color: var(--gold-hi); text-align: center; }
  .rank .who { font-size: 15px; } .rank .who small { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
  .rank .delta { font-family: var(--serif); font-size: 18px; } .rank .delta.plus { color: var(--gold-hi); } .rank .delta.minus { color: var(--danger); }
  .rank .total { font-size: 12px; color: var(--muted); min-width: 44px; text-align: right; }
  .fall { text-align: center; font-family: var(--serif); letter-spacing: .2em; font-size: 14px; color: #f0a79b; border: 1px solid #6d2f27; background: rgba(180,38,31,.14); border-radius: 12px; padding: 10px; }
</style>
</head>
<body>
<header class="page">
  <h1>超富豪 — 画面の見た目の案</h1>
  <p>黒と金を基調にしたカードテーブル風。スマホ縦持ち（390×800）を想定した3画面です。色・文字・配置の方向性を見るためのもので、動きません。カードは白地、選んだカードは上にずれて金色の枠、出せないカードは暗くなります。</p>
</header>

<div class="boards">

  <!-- ===== ロビー ===== -->
  <figure>
    <figcaption><b>1</b>ロビー（ホストの画面）</figcaption>
    <div class="phone">
      <div class="lobby">
        <div class="logo gold-text">超富豪</div>
        <div class="sub">大富豪モード</div>
        <hr class="rule" />
        <div class="box">
          <h3>招待リンク</h3>
          <div class="link"><code>chofugo.example/r/K7M2QX9D4F</code><button class="btn">コピー</button></div>
        </div>
        <div class="box">
          <h3>参加者</h3>
          <div class="seat"><span class="av">な</span><span>なつき</span><span class="sp"></span><span class="chip gold">ホスト</span></div>
          <div class="seat"><span class="av">た</span><span>たろう</span><span class="sp"></span><span class="chip">参加中</span></div>
          <div class="seat"><span class="av">ゆ</span><span>ゆい</span><span class="sp"></span><span class="chip">参加中</span></div>
          <div class="seat cpu"><span class="av">C</span><span>空席（開始すると CPU）</span></div>
        </div>
        <div class="box">
          <h3>ルール</h3>
          <div class="rules">
            <div class="tg on"><span>8切り</span><i class="sw"></i></div>
            <div class="tg on"><span>革命</span><i class="sw"></i></div>
            <div class="tg on"><span>階段</span><i class="sw"></i></div>
            <div class="tg on"><span>スペ3返し</span><i class="sw"></i></div>
            <div class="tg on"><span>都落ち</span><i class="sw"></i></div>
            <div class="tg"><span>J バック</span><i class="sw"></i></div>
            <div class="tg"><span>縛り</span><i class="sw"></i></div>
            <div class="tg"><span>禁止上がり</span><i class="sw"></i></div>
          </div>
        </div>
        <div class="box">
          <h3>ゲーム数</h3>
          <div class="seg"><span class="on">5ゲーム</span><span>10ゲーム</span><span>無制限</span></div>
        </div>
        <div class="grow"></div>
        <button class="btn primary">ゲームを始める</button>
      </div>
    </div>
  </figure>

  <!-- ===== 対戦 ===== -->
  <figure>
    <figcaption><b>2</b>対戦（自分の手番、9の2枚組に返すところ）</figcaption>
    <div class="phone">
      <div class="topbar">
        <span>第3ゲーム / 5</span>
        <span class="title gold-text">超富豪</span>
        <span>得点 ▸</span>
      </div>
      <div class="opps">
        <div class="opp">
          <span class="badge top">大富豪</span>
          <div class="name">たろう</div>
          <div class="fan"><i class="back"></i><i class="back"></i><i class="back"></i><i class="back"></i><i class="back"></i></div>
          <div class="count">5<small>枚</small></div>
        </div>
        <div class="opp">
          <span class="tag">パス</span>
          <span class="badge">貧民</span>
          <div class="name">ゆい</div>
          <div class="fan"><i class="back"></i><i class="back"></i><i class="back"></i><i class="back"></i><i class="back"></i><i class="back"></i><i class="back"></i></div>
          <div class="count">9<small>枚</small></div>
        </div>
        <div class="opp">
          <span class="badge">大貧民</span>
          <div class="name">CPU 1</div>
          <div class="fan"><i class="back"></i><i class="back"></i><i class="back"></i><i class="back"></i><i class="back"></i><i class="back"></i></div>
          <div class="count">7<small>枚</small></div>
        </div>
      </div>

      <div class="field">
        <div class="ring"></div>
        <div class="states"><span class="chip warn">革命中</span><span class="chip gold">縛り ♠ ♥</span></div>
        <div class="cards">
          <div class="card"><span class="n">9</span><span class="s">♠</span><span class="big">♠</span></div>
          <div class="card r"><span class="n">9</span><span class="s">♥</span><span class="big">♥</span></div>
        </div>
        <div class="who">たろう が出したカード</div>
      </div>

      <div class="log">CPU 1 がパスしました</div>

      <div class="me">
        <div class="row">
          <span class="badge">富豪</span><span>なつき（あなたの番）</span><span class="sp"></span><span class="sec">18</span><span style="color:var(--muted);font-size:11px">秒</span>
        </div>
        <div class="timer"><i></i></div>
      </div>
      <div class="hand">
        <div class="card dim"><span class="n">3</span><span class="s">♣</span><span class="big">♣</span></div>
        <div class="card r dim"><span class="n">4</span><span class="s">♦</span><span class="big">♦</span></div>
        <div class="card sel"><span class="n">6</span><span class="s">♠</span><span class="big">♠</span></div>
        <div class="card r sel"><span class="n">6</span><span class="s">♥</span><span class="big">♥</span></div>
        <div class="card"><span class="n">7</span><span class="s">♠</span><span class="big">♠</span></div>
        <div class="card r"><span class="n">7</span><span class="s">♥</span><span class="big">♥</span></div>
        <div class="card r dim"><span class="n">8</span><span class="s">♦</span><span class="big">♦</span></div>
        <div class="card dim"><span class="n t">10</span><span class="s">♣</span><span class="big">♣</span></div>
        <div class="card dim"><span class="n">J</span><span class="s">♠</span><span class="big">♠</span></div>
        <div class="card r dim"><span class="n">K</span><span class="s">♥</span><span class="big">♥</span></div>
        <div class="card dim"><span class="n">A</span><span class="s">♣</span><span class="big">♣</span></div>
        <div class="card joker"><span class="n">JOKER</span><span class="big">★</span></div>
      </div>
      <div class="actions">
        <button class="btn">パス</button>
        <button class="btn primary">2枚を出す</button>
      </div>
    </div>
  </figure>

  <!-- ===== 結果 ===== -->
  <figure>
    <figcaption><b>3</b>ゲームの結果（都落ちが起きた回）</figcaption>
    <div class="phone">
      <div class="result">
        <h2 class="gold-text">結果</h2>
        <div class="small">第3ゲーム / 5</div>
        <hr class="rule" />
        <div class="fall">都落ち ― たろう は大貧民へ</div>
        <div class="rank first">
          <span class="no">1</span>
          <span class="who">なつき<small>大富豪</small></span>
          <span class="delta plus">+2</span><span class="total">計 +3</span>
        </div>
        <div class="rank">
          <span class="no">2</span>
          <span class="who">CPU 1<small>富豪</small></span>
          <span class="delta plus">+1</span><span class="total">計 −3</span>
        </div>
        <div class="rank">
          <span class="no">3</span>
          <span class="who">ゆい<small>貧民</small></span>
          <span class="delta minus">−1</span><span class="total">計 −2</span>
        </div>
        <div class="rank">
          <span class="no">4</span>
          <span class="who">たろう<small>大貧民（都落ち）</small></span>
          <span class="delta minus">−2</span><span class="total">計 +2</span>
        </div>
        <div class="grow"></div>
        <button class="btn primary">次のゲームへ</button>
      </div>
    </div>
  </figure>

</div>
</body>
</html>
